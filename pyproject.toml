[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-interfaces"
version = "0.2.0"
description = "Training-free in-model Agentic Soft-Token Compression (ASTC) on AppWorld"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.11,<3.13"
dependencies = ["torch==2.7.0", "transformers==5.2.0", "safetensors==0.5.3", "accelerate==1.12.0"]
keywords = ["context-compression", "llm-agents", "soft-tokens", "appworld", "qwen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/Hxnng/Agentic-Soft-Token"
Documentation = "https://github.com/Hxnng/Agentic-Soft-Token/blob/main/docs/METHOD.md"
Issues = "https://github.com/Hxnng/Agentic-Soft-Token/issues"

[project.optional-dependencies]
cuda = ["flash-linear-attention==0.4.1", "causal-conv1d==1.7.0"]
evaluation = ["appworld==0.1.3.post1"]
test = ["pytest>=8,<9", "build>=1,<2", "wheel>=0.45,<1", "ruff==0.17.0"]

[project.scripts]
stable-interfaces = "stable_interfaces.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stable_interfaces = ["assets/*.json", "assets/*.csv"]
"stable_interfaces.runtime" = ["assets/*.json", "assets/*.safetensors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["cuda: requires CUDA and the pinned FLA stack"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F"]
